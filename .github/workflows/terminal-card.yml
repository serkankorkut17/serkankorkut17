name: Update terminal card

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/terminal_card.py", ".github/workflows/terminal-card.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate card
        env:
          # METRICS_TOKEN (opsiyonel, repo scope'lu PAT) eklenirse private repoların dilleri de sayılır
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.METRICS_TOKEN != '' && '1' || '0' }}
        run: python .github/scripts/terminal_card.py assets/terminal.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg
          git diff --cached --quiet || git commit -m "Update terminal card"
          git push
